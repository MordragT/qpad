[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
description = "eframe/egui launcher that displays a QR code pointing at the local qpad web server"
license = "MIT OR Apache-2.0"

[dependencies]
# ── Shared (via workspace) ────────────────────────────────────────────────────
proto              = { workspace = true }
uuid               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# ── Launcher specific ─────────────────────────────────────────────────────────
eframe = "0.34"
egui   = "0.34"
image = "0.25"
qrcode = { version = "0.14", features = ["image"] }
ureq   = { version = "3", features = ["json"] }
clap   = { workspace = true }

[[bin]]
name = "qpad-launcher"
path = "src/main.rs"
