[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
description = "eframe/egui launcher that displays a QR code pointing at the local qpad web server"
license = "MIT OR Apache-2.0"

[dependencies]
# ── Shared (via workspace) ────────────────────────────────────────────────────
proto              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
thiserror          = { workspace = true }

# ── Launcher specific ─────────────────────────────────────────────────────────
# eframe = "0.34" # switch to this back when wgpu fixes its swapchain: https://github.com/ValveSoftware/gamescope/issues/1091
eframe = { version = "0.34", default-features = false, features = ["glow", "x11", "wayland"] }
egui   = "0.34"
egui_extras = { version = "0.34", features = ["svg"] }
twemoji-assets = { version = "1.3", features = ["svg"] }
image = "0.25"
qrcode = { version = "0.14", features = ["image"] }
ureq   = { version = "3", features = ["json"] }

[[bin]]
name = "qpad-launcher"
path = "src/main.rs"
