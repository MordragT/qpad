[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
description = "eframe/egui launcher that displays a QR code pointing at the local qpad web server"
license = "MIT OR Apache-2.0"

[dependencies]
# ── Shared (via workspace) ────────────────────────────────────────────────────
proto              = { workspace = true }
uuid               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# ── Launcher specific ─────────────────────────────────────────────────────────
eframe = "0.33"
egui   = "0.33"
qrcode = "0.14"
ureq   = { version = "2", features = ["json"] }

[[bin]]
name = "launcher"
path = "src/main.rs"
