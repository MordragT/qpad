<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
        <title>qpad</title>
        <script id="manifest" type="application/manifest+json">
            {
                "name": "qpad controller",
                "short_name": "qpad",
                "start_url": "./",
                "scope": "/",
                "display": "fullscreen",
                "orientation": "portrait-primary",
                "theme_color": "#0d1117",
                "icons": [
                    {
                        "src": "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMGIxMTRkIi8+PHRleHQgeD0iNTAlIiB5PSI2MCUiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjgwIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgc3R5bGU9InBhaW50LW9yZGVyOm1hcmtlcnMiPlE8L3RleHQ+PC9zdmc+",
                        "sizes": "512x512",
                        "type": "image/svg+xml"
                    }
                ]
            }
        </script>
        <link rel="manifest" href="#manifest" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                height: 100%;
                overflow: hidden;
                background: #0d1117;
                color: #e6edf3;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                touch-action: manipulation;
                user-select: none;
                -webkit-user-select: none;
            }

            #status {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            #pad {
                display: flex;
                align-items: center;
                justify-content: space-around;
                padding: 16px;
                height: calc(100vh - 48px);
                max-width: 700px;
                margin: 0 auto;
            }

            /* 3×3 grid used for both d-pad and face buttons */
            .cluster {
                display: grid;
                grid-template:
                    ".  u  ." 1fr
                    "l  c  r" 1fr
                    ".  d  ." 1fr
                    / 1fr 1fr 1fr;
                gap: 6px;
                width: min(42vw, 160px);
                height: min(42vw, 160px);
            }
            .g-u {
                grid-area: u;
            }
            .g-d {
                grid-area: d;
            }
            .g-l {
                grid-area: l;
            }
            .g-r {
                grid-area: r;
            }

            .pad-btn {
                border: none;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: clamp(16px, 4vw, 22px);
                font-weight: 700;
                background: #21262d;
                color: #c9d1d9;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
                transition:
                    background 60ms,
                    transform 60ms;
            }
            .pad-btn.active {
                background: #388bfd;
                transform: scale(0.92);
            }

            /* face-button accent colours */
            .c-a {
                color: #3fb950;
            }
            .c-b {
                color: #f85149;
            }
            .c-x {
                color: #58a6ff;
            }
            .c-y {
                color: #e3b341;
            }

            /* ── Centre buttons (Start / Select) ─────────────────────────────────── */

            #mid {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .sys-btn {
                background: #21262d;
                border: none;
                border-radius: 16px;
                color: #8b949e;
                font-size: 11px;
                padding: 7px 16px;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
                transition: background 60ms;
            }
            .sys-btn.active {
                background: #388bfd;
                color: #e6edf3;
            }
        </style>
    </head>
    <body>
        <div id="status">
            <p id="status-host">Unknown</p>
            <p id="status-message">Connecting...</p>
        </div>
        <div id="pad">
            <!-- Left cluster: D-pad -->
            <div class="cluster" role="group" aria-label="D-pad">
                <button class="pad-btn g-u" data-bit="64" aria-label="Up">▲</button>
                <button class="pad-btn g-d" data-bit="128" aria-label="Down">▼</button>
                <button class="pad-btn g-l" data-bit="256" aria-label="Left">◀</button>
                <button class="pad-btn g-r" data-bit="512" aria-label="Right">▶</button>
            </div>

            <!-- Centre: Select / Start -->
            <div id="mid">
                <button class="sys-btn" data-bit="32" aria-label="Select">⊟ Select</button>
                <button class="sys-btn" data-bit="16" aria-label="Start">⊞ Start</button>
            </div>

            <!-- Right cluster: face buttons (Xbox layout) -->
            <!--   Y(top) / X(left) A(bottom) B(right)      -->
            <div class="cluster" role="group" aria-label="Face buttons">
                <button class="pad-btn g-u c-y" data-bit="4" aria-label="Y">Y</button>
                <button class="pad-btn g-d c-a" data-bit="1" aria-label="A">A</button>
                <button class="pad-btn g-l c-x" data-bit="8" aria-label="X">X</button>
                <button class="pad-btn g-r c-b" data-bit="2" aria-label="B">B</button>
            </div>
        </div>

        <script>
            (function () {
                "use strict";

                function uuidv4() {
                    return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
                        (+c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (+c / 4)))).toString(16),
                    );
                }

                const statusHost = document.getElementById("status-host");
                statusHost.textContent = location.host;

                const statusMsg = document.getElementById("status-message");
                function setStatus(text) {
                    statusMsg.textContent = text;
                }

                let ws = null;
                let clientId = uuidv4(); // this sadly fails on older mobile: crypto.randomUUID();
                let seq = 0;
                let buttons = 0; // current bitmask of pressed buttons

                function sendInput() {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    ws.send(
                        JSON.stringify({
                            Input: {
                                client_id: clientId,
                                seq: ++seq,
                                buttons,
                                axes: [],
                                ts_millis: Date.now(),
                            },
                        }),
                    );
                }

                const allBtns = [...document.querySelectorAll("[data-bit]")];
                allBtns.forEach(function (btn) {
                    var bit = Number(btn.dataset.bit);

                    function press(e) {
                        e.preventDefault();
                        buttons |= bit;
                        btn.classList.add("active");
                        sendInput();
                    }
                    function release(e) {
                        e.preventDefault();
                        if (!(buttons & bit)) return; // already released
                        buttons &= ~bit;
                        btn.classList.remove("active");
                        sendInput();
                    }

                    btn.addEventListener("pointerdown", press);
                    btn.addEventListener("pointerup", release);
                    btn.addEventListener("pointerleave", release);
                    btn.addEventListener("pointercancel", release);
                });

                function connect() {
                    if (ws) return;

                    var scheme = location.protocol === "https:" ? "wss" : "ws";
                    var url = scheme + "://" + location.host + "/ws";

                    ws = new WebSocket(url);

                    ws.onopen = function () {
                        ws.send(
                            JSON.stringify({
                                Register: {
                                    client_id: clientId,
                                },
                            }),
                        );
                        setStatus("Connected");
                    };

                    ws.onclose = function () {
                        // Release any held buttons on disconnect.
                        buttons = 0;
                        allBtns.forEach(function (b) {
                            b.classList.remove("active");
                        });
                        ws = null;
                    };

                    ws.onerror = function () {
                        setStatus("Connection error");
                    };

                    // Server sends no messages
                    ws.onmessage = function () {};
                }

                connect();
            })();
        </script>
    </body>
</html>
