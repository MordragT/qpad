[package]
name = "web"
version = "0.1.0"
edition = "2024"
description = "Axum-based web server for qpad: serves the controller client, handles WebSocket sessions, and bridges input to evdevil"
license = "MIT OR Apache-2.0"

[dependencies]
# ── Shared (via workspace) ────────────────────────────────────────────────────
proto              = { workspace = true }
uuid               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# ── Web-server specific ───────────────────────────────────────────────────────
tokio        = { version = "1",   features = ["full"] }
axum         = { version = "0.8", features = ["ws"] }
dashmap      = "6.1"
futures-util = "0.3"
evdevil      = "0.4"
clap         = { workspace = true }

[[bin]]
name = "qpad-web"
path = "src/main.rs"
